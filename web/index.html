<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>幽灵粒子猎人</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/400.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/700.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/900.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/zcool-kuaile/400.css">
  <style>
    :root { --bg: #02040c; --fg: #e8f6ff; --accent: #8be9ff; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: "Noto Sans SC", sans-serif; overflow: hidden; }
    #stage { position: absolute; inset: 0; display: grid; place-items: center; }
    canvas { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; display: block; background: #000; }
    body.render canvas { width: 1920px; height: 1080px; }
    #bar { position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; gap: 12px;
      align-items: center; opacity: 0; transition: opacity .3s; }
    body:not(.render):hover #bar, body.paused #bar { opacity: 1; }
    #bar button { background: var(--accent); color: #02040c; border: 0; border-radius: 999px;
      padding: 8px 18px; font: 700 15px "Noto Sans SC", sans-serif; cursor: pointer; }
    #bar input { flex: 1; accent-color: var(--accent); }
    #bar span { font: 13px ui-monospace, monospace; min-width: 96px; text-align: right; }
    body.render #bar { display: none; }
  </style>
</head>
<body class="paused">
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="bar">
    <button id="play">▶ 播放</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="clock">0:00</span>
  </div>
  <audio id="audio" src="data/soundtrack.m4a" preload="auto"></audio>
  <script type="module" src="js/main.js"></script>
</body>
</html>
